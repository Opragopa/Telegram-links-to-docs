<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Telegram Posts Exporter</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b}body{margin:0;background:#eef4f8}main{width:min(720px,calc(100% - 32px));margin:42px auto}.card{background:white;border-radius:20px;padding:30px;box-shadow:0 12px 35px #78909c30}h1{margin:0 0 8px;font-size:28px}h2{font-size:19px;margin:28px 0 12px}p{color:#637381;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;color:#52616b;font-size:14px}.full{grid-column:1/-1}input{width:100%;border:1px solid #d5e0e7;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}button{margin-top:14px;border:0;border-radius:10px;padding:13px 18px;background:#229ed9;color:white;font-size:16px;cursor:pointer}button.secondary{background:#607d8b}button:disabled{opacity:.55}.step{border-top:1px solid #e8eef2;margin-top:25px;padding-top:5px}.hidden{display:none}#status{margin-top:22px;padding:15px;border-radius:10px;background:#f5f8fa;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}.hint{font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main><section class="card">
<h1>Экспорт постов Telegram</h1><p>Войдите в Telegram, выберите канал и период. Терминал не нужен.</p>
<div class="step"><h2>1. Вход в Telegram</h2><div class="grid">
<label>API ID<input id="api_id" inputmode="numeric" placeholder="12345678"></label><label>API Hash<input id="api_hash" placeholder="из my.telegram.org"></label><label class="full">Номер телефона<input id="phone" placeholder="+79991234567"></label>
</div><button id="send-code">Получить код</button><div id="code-box" class="hidden"><label style="margin-top:14px">Код из Telegram<input id="code" inputmode="numeric"></label><label style="margin-top:14px">Пароль 2FA, если включён<input id="password" type="password"></label><button id="verify">Войти</button></div></div>
<div class="step"><h2>2. Экспорт</h2><div class="grid"><label class="full">Канал или ссылка<input id="channel" placeholder="@channel или https://t.me/channel"></label><label>Начало<input id="from_date" type="date"></label><label>Конец<input id="to_date" type="date"></label></div><button id="export" disabled>Начать экспорт</button></div>
<div id="status">Статус: ожидается вход</div><p class="hint">API ID и API Hash берутся на my.telegram.org и хранятся только в памяти локального приложения.</p>
</section></main><script>
const $=id=>document.getElementById(id), status=$('status'), send=$('send-code'), verify=$('verify'), exportButton=$('export');
function show(text){status.textContent=text}
send.onclick=async()=>{send.disabled=true;show('Отправляем код...');const r=await fetch('/api/auth/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_id:$('api_id').value,api_hash:$('api_hash').value,phone:$('phone').value})});const d=await r.json();if(!r.ok){show('Ошибка: '+d.error);send.disabled=false;return}if(d.status==='authorized'){loggedIn();return}$('code-box').classList.remove('hidden');show('Код отправлен в Telegram')};
verify.onclick=async()=>{verify.disabled=true;const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value,password:$('password').value})});const d=await r.json();if(!r.ok){show('Ошибка: '+d.error);verify.disabled=false;return}if(d.status==='password_required'){show('Введите пароль 2FA и нажмите «Войти» ещё раз');verify.disabled=false;return}loggedIn()};
function loggedIn(){send.disabled=true;verify.disabled=true;exportButton.disabled=false;show('Вы вошли в Telegram. Можно запускать экспорт.')}
exportButton.onclick=async()=>{exportButton.disabled=true;show('Запускаем экспорт...');const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:$('channel').value,from_date:$('from_date').value,to_date:$('to_date').value})});const d=await r.json();if(!r.ok){show('Ошибка: '+d.error);exportButton.disabled=false;return}const timer=setInterval(async()=>{const result=await(await fetch('/api/jobs/'+d.job_id)).json();show(result.log);if(result.status==='done'||result.status==='error'){clearInterval(timer);exportButton.disabled=false}},1000)};
</script></body></html>
